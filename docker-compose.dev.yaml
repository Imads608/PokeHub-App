# Use postgres/example user/password credentials

services:
  pokehub-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: npx nx serve pokehub-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgresdb
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: pokehub
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3000:3000
    volumes:
      # Bind-mount the workspace for hot reload, but keep the image's installed
      # dependencies by shadowing node_modules with an anonymous volume.
      - .:/app
      - /app/node_modules
    depends_on:
      - postgresdb
      - redis

  pokehub-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: npx nx serve pokehub-app
    environment:
      NODE_ENV: development
      # Browser-facing URL (the API is published on the host at :3000).
      NEXT_PUBLIC_POKEHUB_API_URL: http://localhost:3000/api
      # Server-side URL used within the compose network (NextAuth JWT callback,
      # RSC/route handlers). The shared fetch client reads `API_URL`.
      API_URL: http://pokehub-api:3000/api
    ports:
      - 4200:4200
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - pokehub-api

  postgresdb:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: pokehub
    ports:
      - 5432:5432
  pgAdmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - 8081:8081
    depends_on:
      - redis

volumes:
  redis_data:
